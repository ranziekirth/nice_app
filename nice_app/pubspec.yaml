name: nice_app
description: "Nice - a simple tenant billing app for landlords."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0
  firebase_auth: ^6.1.0
  flutter_launcher_icons: ^0.14.4
  share_plus: ^12.0.2

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: "assets/images/nicelogo.png"
    background_color: "#E17B44"
    theme_color: "#E17B44"

  image_path: "assets/images/nicelogo.png"
  adaptive_icon_background: "#E17B44"
  adaptive_icon_foreground: "assets/images/nicelogo.png"
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/background.png
    - assets/images/n_logo.png
    - assets/images/nicelogo.png
